name: Build debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Find and Build with Gradle
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f -print -quit)
          if [ -n "$GRADLEW_FILE" ]; then
            DIR_NAME=$(dirname "$GRADLEW_FILE")
            echo "Đã tìm thấy gradlew tại thư mục: $DIR_NAME"
            cd "$DIR_NAME"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Không tìm thấy file gradlew trong mã nguồn!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
