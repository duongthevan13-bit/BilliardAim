name: Build debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Find and build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            # Tìm xem gradlew nằm ở đâu trong các thư mục con
            GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
            if [ -n "$GRADLEW_PATH" ]; then
              DIR_PATH=$(dirname "$GRADLEW_PATH")
              cd "$DIR_PATH"
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            else
              echo "Không tìm thấy file gradlew!"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
