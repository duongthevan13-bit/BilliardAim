name: Build debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle Wrapper & Build APK
        run: |
          # Nếu không tìm thấy gradlew, tự động tạo mới nó bằng lệnh gradle wrapper
          if [ ! -f "./gradlew" ]; then
            echo "Đang tạo mới Gradle Wrapper cho dự án..."
            gradle wrapper
          fi

          # Cấp quyền và tiến hành build
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
